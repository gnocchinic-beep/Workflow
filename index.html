<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --paper: #f4f2ec;
  --ink: #1b1b1f;
  --ink-soft: #6b6a63;
  --line: #e1ddd0;
  --teal: #2f6f6b;
  --teal-dark: #204d4a;
  --card-bg: #ffffff;
  --danger: #b3452f;
  --folder-top: #4f9fd8;
  --folder-body: #2f8fce;
  --urgent-alta: #c94b4b;
  --urgent-media: #d19a3a;
  --urgent-bassa: #4e9a62;
}
 
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
  background: var(--paper);
  color: var(--ink);
}
h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 7px;
  padding: 0.5rem 0.9rem;
  font-size: 0.85rem;
}
input, select, textarea { font-family: inherit; }
[hidden] { display: none !important; }
 
/* ---------- LOGIN ---------- */
.login-screen { height: 100%; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.login-card {
  width: 100%; max-width: 320px; background: var(--card-bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 2rem 1.75rem;
}
.login-card h1 { font-size: 1.5rem; margin-bottom: 0.15rem; }
.login-sub { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 1.4rem; }
.login-card label { display: block; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.9rem; }
.login-card input {
  display: block; width: 100%; margin-top: 0.3rem; padding: 0.55rem 0.6rem;
  border: 1px solid var(--line); border-radius: 7px; font-size: 0.9rem;
  background: var(--paper); color: var(--ink);
}
.login-card button {
  width: 100%; background: var(--teal); color: #fff; padding: 0.6rem;
  font-weight: 600; margin-top: 0.3rem;
}
.login-card button:hover { background: var(--teal-dark); }
.login-error { color: var(--danger); font-size: 0.78rem; margin-top: 0.8rem; }
 
/* ---------- SHELL ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--line);
}
.topbar h1 { flex: 1; }
.btn-ghost { background: transparent; color: var(--ink-soft); }
.btn-ghost:hover { color: var(--ink); }
.btn-secondary { background: var(--card-bg); border: 1px solid var(--line); color: var(--ink); }
.btn-secondary:hover { border-color: var(--teal); color: var(--teal-dark); }
#back-btn { font-weight: 600; }
 
/* ---------- HOME: cartelle ---------- */
.view-home { flex: 1; overflow-y: auto; padding: 2rem; }
.folder-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 1.75rem; max-width: 900px;
}
.folder-tile {
  background: transparent; border: none; padding: 0; display: flex;
  flex-direction: column; align-items: center; gap: 0.6rem; position: relative;
}
.folder-icon {
  width: 100px; height: 76px; position: relative;
}
.folder-icon::before {
  content: ""; position: absolute; top: 0; left: 6px; width: 46px; height: 16px;
  background: var(--folder-top); border-radius: 6px 10px 0 0;
}
.folder-icon::after {
  content: ""; position: absolute; top: 10px; left: 0; width: 100px; height: 66px;
  background: var(--folder-body); border-radius: 8px;
  box-shadow: 0 6px 14px rgba(47,143,206,0.28);
}
.folder-tile:hover .folder-icon::after { filter: brightness(1.05); }
.folder-label {
  font-size: 0.85rem; font-weight: 600; text-align: center;
  max-width: 120px; overflow-wrap: break-word;
}
.folder-delete {
  position: absolute; top: -6px; right: 6px; background: var(--card-bg);
  border: 1px solid var(--line); border-radius: 50%; width: 22px; height: 22px;
  padding: 0; font-size: 0.8rem; color: var(--ink-soft); visibility: hidden;
  display: flex; align-items: center; justify-content: center;
}
.folder-tile:hover .folder-delete { visibility: visible; }
.folder-delete:hover { color: var(--danger); border-color: var(--danger); }
 
.folder-tile.add-tile .folder-icon::before,
.folder-tile.add-tile .folder-icon::after { background: transparent; border: 2px dashed var(--line); box-shadow: none; }
.folder-tile.add-tile .folder-icon::before { border-bottom: none; }
.folder-tile.add-tile .plus-sign {
  position: absolute; inset: 10px 0 0 0; height: 66px; display: flex;
  align-items: center; justify-content: center; font-size: 1.8rem; color: var(--ink-soft);
}
.folder-tile.add-tile:hover .plus-sign { color: var(--teal-dark); }
.folder-tile.add-tile:hover .folder-icon::before,
.folder-tile.add-tile:hover .folder-icon::after { border-color: var(--teal); }
 
/* ---------- BOARD TOOLBAR ---------- */
.board-toolbar {
  display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.board-name-input {
  flex: 1; max-width: 320px; border: 1px solid var(--line); border-radius: 7px;
  padding: 0.4rem 0.6rem; font-size: 0.9rem; font-weight: 600;
  background: var(--card-bg); color: var(--ink);
}
.board-name-input:focus { outline: 1px solid var(--teal); }
 
/* ---------- COLONNE ---------- */
.view-board { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.board-columns { flex: 1; display: flex; gap: 1.1rem; padding: 1.25rem 1.5rem; overflow-x: auto; }
.column { flex: 1 1 0; min-width: 240px; display: flex; flex-direction: column; min-height: 0; }
.column-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 0.2rem 0.6rem; border-bottom: 2px solid var(--line); margin-bottom: 0.75rem;
}
.column-header h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); }
.add-card-btn { background: transparent; color: var(--ink-soft); font-size: 1.1rem; padding: 0.1rem 0.5rem; line-height: 1; }
.add-card-btn:hover { color: var(--teal-dark); }
.card-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.9rem; padding-bottom: 0.5rem; min-height: 50px; }
.card-list.drag-over { background: rgba(0,0,0,0.03); border-radius: 10px; }
 
/* ---------- POST-IT ---------- */
.card {
  position: relative; border-radius: 3px; padding: 0.8rem 0.85rem 0.7rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12); cursor: grab;
  transform: rotate(var(--tilt, -1deg));
}
.card:nth-child(3n+1) { --tilt: -1.2deg; }
.card:nth-child(3n+2) { --tilt: 0.8deg; }
.card:nth-child(3n+3) { --tilt: -0.4deg; }
.card.dragging { opacity: 0.4; }
.card-title {
  width: 100%; border: none; background: transparent; font-family: "Caveat", cursive;
  font-weight: 700; font-size: 1.35rem; color: #2a2a2a; margin-bottom: 0.3rem;
}
.card-title::placeholder { color: rgba(0,0,0,0.35); }
.card-title:focus { outline: none; }
.card-row { display: flex; gap: 0.4rem; margin-bottom: 0.45rem; }
.card-select {
  flex: 1; min-width: 0; font-size: 0.72rem; border: 1px solid rgba(0,0,0,0.15);
  border-radius: 5px; padding: 0.2rem 0.3rem; background: rgba(255,255,255,0.6); color: #2a2a2a;
}
.urgency-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; align-self: center; }
.urgency-alta { background: var(--urgent-alta); }
.urgency-media { background: var(--urgent-media); }
.urgency-bassa { background: var(--urgent-bassa); }
.card-desc {
  width: 100%; border: none; background: transparent; resize: none; font-size: 0.82rem;
  color: #3a3a3a; min-height: 2.1em; font-family: inherit; margin-bottom: 0.4rem;
}
.card-desc:focus { outline: none; }
.card-desc::placeholder { color: rgba(0,0,0,0.35); }
.card-timer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 0.4rem; border-top: 1px dashed rgba(0,0,0,0.18);
}
.timer-display { font-variant-numeric: tabular-nums; font-size: 0.72rem; color: rgba(0,0,0,0.6); }
.timer-toggle { background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.15); color: #2a2a2a; padding: 0.2rem 0.6rem; font-size: 0.72rem; font-weight: 600; }
.card.timing .timer-toggle { background: #2a2a2a; color: #fff; }
.card.timing .timer-display { font-weight: 700; }
.delete-card-btn {
  position: absolute; top: 0.3rem; right: 0.4rem; background: transparent;
  color: rgba(0,0,0,0.35); font-size: 0.95rem; padding: 0 0.2rem;
}
.delete-card-btn:hover { color: var(--danger); }
 
/* ---------- PANNELLO CATEGORIE ---------- */
.panel-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 10;
}
.categories-panel {
  position: fixed; top: 0; right: 0; height: 100%; width: 300px; max-width: 90vw;
  background: var(--card-bg); border-left: 1px solid var(--line); z-index: 11;
  padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto;
}
.categories-panel h2 { font-size: 1rem; }
.panel-close { position: absolute; top: 1rem; right: 1rem; background: transparent; color: var(--ink-soft); font-size: 1.1rem; }
.category-row { display: flex; align-items: center; gap: 0.5rem; }
.category-swatch { width: 20px; height: 20px; border-radius: 5px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,0.1); }
.category-name-input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px;
  padding: 0.35rem 0.5rem; font-size: 0.85rem; background: var(--paper); color: var(--ink);
}
.category-color-input { width: 32px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.category-delete { background: transparent; color: var(--ink-soft); font-size: 0.9rem; padding: 0 0.3rem; }
.category-delete:hover { color: var(--danger); }
.add-category-btn { width: 100%; background: var(--card-bg); border: 1px dashed var(--line); color: var(--ink-soft); }
.add-category-btn:hover { border-color: var(--teal); color: var(--teal-dark); }
</style>
</head>
<body>
 
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <h1>Flusso</h1>
      <p class="login-sub">Accedi per gestire i tuoi lavori</p>
      <label>Email
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>Password
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit">Entra</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>
 
  <!-- APP -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="back-btn" class="btn-ghost" hidden>&larr; Bacheche</button>
      <h1 id="context-title">Flusso</h1>
      <button id="categories-btn" class="btn-secondary">Categorie</button>
      <button id="logout-btn" class="btn-ghost">Esci</button>
    </header>
 
    <!-- HOME -->
    <main id="view-home" class="view-home">
      <div id="folder-grid" class="folder-grid"></div>
    </main>
 
    <!-- BOARD -->
    <main id="view-board" class="view-board" hidden>
      <div class="board-toolbar">
        <input id="board-name-input" class="board-name-input" type="text" placeholder="Nome bacheca" />
        <button id="delete-board-btn" class="btn-ghost">Elimina bacheca</button>
      </div>
      <div id="board-columns" class="board-columns"></div>
    </main>
  </div>
 
  <div id="panel-backdrop" class="panel-backdrop" hidden></div>
  <aside id="categories-panel" class="categories-panel" hidden>
    <button id="panel-close" class="panel-close">&times;</button>
    <h2>Categorie</h2>
    <div id="categories-list"></div>
    <button id="add-category-btn" class="add-category-btn">+ Nuova categoria</button>
  </aside>
 
  <!-- TEMPLATE: scheda post-it -->
  <template id="card-template">
    <article class="card" draggable="true">
      <button class="delete-card-btn" title="Elimina">&times;</button>
      <input class="card-title" type="text" placeholder="Titolo lavoro" />
      <div class="card-row">
        <select class="card-category"></select>
        <select class="card-urgency">
          <option value="bassa">Bassa</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>
      <textarea class="card-desc" placeholder="Note..."></textarea>
      <div class="card-timer">
        <span class="timer-display">00:00:00</span>
        <button class="timer-toggle">Avvia</button>
      </div>
    </article>
  </template>
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
const cfgError = document.getElementById("login-error");
function showFatal(msg) { cfgError.textContent = msg; cfgError.hidden = false; }
window.addEventListener("error", (e) => showFatal("Errore: " + e.message));
 
let SB_URL = String(window.FLUSSO_URL || "").trim().replace(/\/rest\/v1\/?$/, "").replace(/\/+$/, "");
let SB_KEY = String(window.FLUSSO_KEY || "").trim();
let sb = null;
if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(SB_URL)) {
  showFatal("Configurazione: l'URL Supabase non e' valido.");
} else if (SB_KEY.length < 60 || SB_KEY.indexOf("eyJ") !== 0) {
  showFatal("Configurazione: la chiave anon non e' valida.");
} else {
  sb = window.supabase.createClient(SB_URL, SB_KEY);
}
 
const COLUMNS = [
  { id: "todo", title: "To do" },
  { id: "today", title: "Today" },
  { id: "progress", title: "Progress" },
  { id: "done", title: "Done" },
];
const DEFAULT_CATEGORIES = [
  { name: "Sedi", color: "#cfeccf" },
  { name: "Sponsor", color: "#f9d7e6" },
  { name: "Cantieri", color: "#e3d6f5" },
];
 
const loginScreen = document.getElementById("login-screen");
const loginForm = document.getElementById("login-form");
const loginError = document.getElementById("login-error");
const appEl = document.getElementById("app");
const backBtn = document.getElementById("back-btn");
const contextTitle = document.getElementById("context-title");
const logoutBtn = document.getElementById("logout-btn");
const viewHome = document.getElementById("view-home");
const viewBoard = document.getElementById("view-board");
const folderGrid = document.getElementById("folder-grid");
const boardColumnsEl = document.getElementById("board-columns");
const boardNameInput = document.getElementById("board-name-input");
const deleteBoardBtn = document.getElementById("delete-board-btn");
const categoriesBtn = document.getElementById("categories-btn");
const categoriesPanel = document.getElementById("categories-panel");
const panelBackdrop = document.getElementById("panel-backdrop");
const panelClose = document.getElementById("panel-close");
const categoriesList = document.getElementById("categories-list");
const addCategoryBtn = document.getElementById("add-category-btn");
const cardTemplate = document.getElementById("card-template");
 
let boards = [];
let categories = [];
let activeBoardId = null;
let view = "home";
let dirty = false;
let saveTimeout = null;
let tickInterval = null;
let realtimeChannel = null;
 
function activeBoard() { return boards.find((b) => b.id === activeBoardId); }
function uid_() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
 
/* ---------- AUTH ---------- */
if (sb) sb.auth.onAuthStateChange((_event, session) => {
  if (session && session.user) {
    loginScreen.hidden = true;
    appEl.hidden = false;
    loadEverything();
    startTicking();
  } else {
    if (realtimeChannel) sb.removeChannel(realtimeChannel);
    stopTicking();
    appEl.hidden = true;
    loginScreen.hidden = false;
  }
});
 
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sb) return;
  loginError.hidden = true;
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { loginError.textContent = "Accesso non riuscito: " + error.message; loginError.hidden = false; }
});
logoutBtn.addEventListener("click", () => sb.auth.signOut());
 
/* ---------- CARICAMENTO ---------- */
async function loadEverything() {
  const [{ data: boardData, error: boardErr }, { data: catData, error: catErr }] = await Promise.all([
    sb.from("boards").select("*").order("position", { ascending: true }),
    sb.from("categories").select("*").order("position", { ascending: true }),
  ]);
  if (boardErr) { alert("Errore nel caricamento delle bacheche: " + boardErr.message); return; }
  if (catErr) { alert("Errore nel caricamento delle categorie: " + catErr.message); return; }
 
  boards = boardData;
  categories = catData;
 
  if (categories.length === 0) {
    for (const c of DEFAULT_CATEGORIES) {
      const created = await createCategory(c.name, c.color);
      if (created) categories.push(created);
    }
  }
  if (boards.length === 0) {
    const created = await createBoard("Sede principale");
    if (created) boards = [created];
  }
 
  goHome();
  subscribeRealtime();
}
 
async function createBoard(name) {
  const { data, error } = await sb.from("boards")
    .insert({ name, position: Date.now(), data: { tasks: [] } })
    .select().single();
  if (error) { alert("Errore nella creazione della bacheca: " + error.message); return null; }
  return data;
}
async function createCategory(name, color) {
  const { data, error } = await sb.from("categories")
    .insert({ name, color, position: Date.now() })
    .select().single();
  if (error) { alert("Errore nella creazione della categoria: " + error.message); return null; }
  return data;
}
 
function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel("flusso-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "boards" }, (payload) => {
      if (dirty) return;
      if (payload.eventType === "DELETE") boards = boards.filter((b) => b.id !== payload.old.id);
      else {
        const idx = boards.findIndex((b) => b.id === payload.new.id);
        if (idx === -1) boards.push(payload.new); else boards[idx] = payload.new;
      }
      if (view === "home") renderHome();
      else if (activeBoard()) renderBoardView(); else goHome();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "categories" }, (payload) => {
      if (payload.eventType === "DELETE") categories = categories.filter((c) => c.id !== payload.old.id);
      else {
        const idx = categories.findIndex((c) => c.id === payload.new.id);
        if (idx === -1) categories.push(payload.new); else categories[idx] = payload.new;
      }
      if (view === "board") renderBoardView();
      renderCategoriesPanel();
    })
    .subscribe();
}
 
/* ---------- SALVATAGGIO BACHECA ---------- */
function scheduleSave() {
  dirty = true;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveNow, 500);
}
async function saveNow() {
  clearTimeout(saveTimeout);
  const board = activeBoard();
  if (!board) { dirty = false; return; }
  const { error } = await sb.from("boards")
    .update({ name: board.name, data: board.data, updated_at: new Date().toISOString() })
    .eq("id", board.id);
  dirty = false;
  if (error) console.error("Errore nel salvataggio:", error.message);
}
 
/* ---------- NAVIGAZIONE ---------- */
function goHome() {
  view = "home";
  activeBoardId = null;
  backBtn.hidden = true;
  contextTitle.textContent = "Flusso";
  viewHome.hidden = false;
  viewBoard.hidden = true;
  renderHome();
}
function openBoard(id) {
  view = "board";
  activeBoardId = id;
  backBtn.hidden = false;
  viewHome.hidden = true;
  viewBoard.hidden = false;
  renderBoardView();
}
backBtn.addEventListener("click", goHome);
 
/* ---------- HOME: cartelle ---------- */
function renderHome() {
  folderGrid.innerHTML = "";
  boards.slice().sort((a, b) => a.position - b.position).forEach((b) => {
    const tile = document.createElement("button");
    tile.className = "folder-tile";
    tile.innerHTML = '<span class="folder-icon"></span><span class="folder-label"></span>';
    tile.querySelector(".folder-label").textContent = b.name || "(senza nome)";
    tile.addEventListener("click", () => openBoard(b.id));
 
    const del = document.createElement("button");
    del.className = "folder-delete";
    del.innerHTML = "&times;";
    del.title = "Elimina bacheca";
    del.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (boards.length === 1) { alert("Non puoi eliminare l'unica bacheca rimasta."); return; }
      if (!confirm('Eliminare la bacheca "' + (b.name || "") + '" e tutti i suoi lavori?')) return;
      const { error } = await sb.from("boards").delete().eq("id", b.id);
      if (error) { alert("Errore nell'eliminazione: " + error.message); return; }
      boards = boards.filter((x) => x.id !== b.id);
      renderHome();
    });
    tile.appendChild(del);
    folderGrid.appendChild(tile);
  });
 
  const addTile = document.createElement("button");
  addTile.className = "folder-tile add-tile";
  addTile.innerHTML = '<span class="folder-icon"><span class="plus-sign">+</span></span><span class="folder-label">Nuova bacheca</span>';
  addTile.addEventListener("click", async () => {
    const name = prompt("Nome della nuova bacheca (es. Sede Torino):", "Nuova sede");
    if (!name) return;
    const created = await createBoard(name);
    if (created) { boards.push(created); renderHome(); }
  });
  folderGrid.appendChild(addTile);
}
 
/* ---------- BOARD: colonne e post-it ---------- */
boardNameInput.addEventListener("change", () => {
  const board = activeBoard();
  if (!board) return;
  board.name = boardNameInput.value;
  scheduleSave();
});
deleteBoardBtn.addEventListener("click", async () => {
  const board = activeBoard();
  if (!board) return;
  if (boards.length === 1) { alert("Non puoi eliminare l'unica bacheca rimasta."); return; }
  if (!confirm('Eliminare la bacheca "' + (board.name || "") + '" e tutti i suoi lavori?')) return;
  const { error } = await sb.from("boards").delete().eq("id", board.id);
  if (error) { alert("Errore nell'eliminazione: " + error.message); return; }
  boards = boards.filter((b) => b.id !== board.id);
  goHome();
});
 
function renderBoardView() {
  const board = activeBoard();
  if (!board) { goHome(); return; }
  contextTitle.textContent = board.name || "Bacheca";
  boardNameInput.value = board.name || "";
  boardColumnsEl.innerHTML = "";
  if (!board.data.tasks) board.data.tasks = [];
  COLUMNS.forEach((col) => boardColumnsEl.appendChild(renderColumn(board, col)));
}
 
function renderColumn(board, col) {
  const node = document.createElement("section");
  node.className = "column";
  node.innerHTML =
    '<div class="column-header"><h2></h2><button class="add-card-btn" title="Aggiungi scheda">+</button></div>' +
    '<div class="card-list"></div>';
  node.querySelector("h2").textContent = col.title;
 
  node.querySelector(".add-card-btn").addEventListener("click", () => {
    board.data.tasks.push({
      id: uid_(), title: "", desc: "", status: col.id,
      categoryId: categories[0] ? categories[0].id : null,
      urgency: "media", order: Date.now(), timeSpent: 0, timerStartedAt: null,
    });
    scheduleSave();
    renderBoardView();
  });
 
  const list = node.querySelector(".card-list");
  list.addEventListener("dragover", (e) => { e.preventDefault(); list.classList.add("drag-over"); });
  list.addEventListener("dragleave", () => list.classList.remove("drag-over"));
  list.addEventListener("drop", (e) => {
    e.preventDefault();
    list.classList.remove("drag-over");
    const taskId = e.dataTransfer.getData("text/plain");
    const task = board.data.tasks.find((t) => t.id === taskId);
    if (task) { task.status = col.id; task.order = Date.now(); scheduleSave(); renderBoardView(); }
  });
 
  board.data.tasks
    .filter((t) => (t.status || "todo") === col.id)
    .sort((a, b) => a.order - b.order)
    .forEach((task) => list.appendChild(renderCard(board, task)));
 
  return node;
}
 
function renderCard(board, task) {
  const node = cardTemplate.content.firstElementChild.cloneNode(true);
  node.dataset.taskId = task.id;
  const category = categories.find((c) => c.id === task.categoryId);
  node.style.background = category ? category.color : "#f5f0d8";
  if (task.timerStartedAt) node.classList.add("timing");
 
  node.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", task.id); node.classList.add("dragging"); });
  node.addEventListener("dragend", () => node.classList.remove("dragging"));
 
  const titleInput = node.querySelector(".card-title");
  titleInput.value = task.title;
  titleInput.addEventListener("change", () => { task.title = titleInput.value; scheduleSave(); });
 
  const catSelect = node.querySelector(".card-category");
  categories.forEach((c) => {
    const opt = document.createElement("option");
    opt.value = c.id; opt.textContent = c.name;
    if (c.id === task.categoryId) opt.selected = true;
    catSelect.appendChild(opt);
  });
  catSelect.addEventListener("change", () => {
    task.categoryId = catSelect.value;
    scheduleSave();
    renderBoardView();
  });
 
  const urgSelect = node.querySelector(".card-urgency");
  urgSelect.value = task.urgency || "media";
  urgSelect.addEventListener("change", () => { task.urgency = urgSelect.value; scheduleSave(); });
 
  const descInput = node.querySelector(".card-desc");
  descInput.value = task.desc || "";
  descInput.addEventListener("change", () => { task.desc = descInput.value; scheduleSave(); });
 
  node.querySelector(".delete-card-btn").addEventListener("click", () => {
    board.data.tasks = board.data.tasks.filter((t) => t.id !== task.id);
    scheduleSave();
    renderBoardView();
  });
 
  const display = node.querySelector(".timer-display");
  display.textContent = formatDuration(currentElapsed(task));
  node.querySelector(".timer-toggle").addEventListener("click", () => {
    if (task.timerStartedAt) {
      task.timeSpent += Date.now() - task.timerStartedAt;
      task.timerStartedAt = null;
    } else {
      boards.forEach((b) => (b.data.tasks || []).forEach((t) => {
        if (t.timerStartedAt) { t.timeSpent += Date.now() - t.timerStartedAt; t.timerStartedAt = null; }
      }));
      task.timerStartedAt = Date.now();
    }
    scheduleSave();
    renderBoardView();
  });
 
  return node;
}
 
function currentElapsed(task) { return (task.timeSpent || 0) + (task.timerStartedAt ? Date.now() - task.timerStartedAt : 0); }
function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
  const s = String(totalSec % 60).padStart(2, "0");
  return h + ":" + m + ":" + s;
}
function startTicking() {
  tickInterval = setInterval(() => {
    document.querySelectorAll(".card.timing").forEach((node) => {
      const board = activeBoard();
      if (!board) return;
      const task = (board.data.tasks || []).find((t) => t.id === node.dataset.taskId);
      if (task) node.querySelector(".timer-display").textContent = formatDuration(currentElapsed(task));
    });
  }, 1000);
}
function stopTicking() { clearInterval(tickInterval); }
 
/* ---------- PANNELLO CATEGORIE ---------- */
function openPanel() { categoriesPanel.hidden = false; panelBackdrop.hidden = false; renderCategoriesPanel(); }
function closePanel() { categoriesPanel.hidden = true; panelBackdrop.hidden = true; }
categoriesBtn.addEventListener("click", openPanel);
panelClose.addEventListener("click", closePanel);
panelBackdrop.addEventListener("click", closePanel);
 
function renderCategoriesPanel() {
  if (categoriesPanel.hidden) return;
  categoriesList.innerHTML = "";
  categories.slice().sort((a, b) => a.position - b.position).forEach((cat) => {
    const row = document.createElement("div");
    row.className = "category-row";
    row.innerHTML =
      '<input type="color" class="category-color-input" />' +
      '<input type="text" class="category-name-input" />' +
      '<button class="category-delete" title="Elimina">&times;</button>';
    const colorInput = row.querySelector(".category-color-input");
    const nameInput = row.querySelector(".category-name-input");
    colorInput.value = cat.color;
    nameInput.value = cat.name;
 
    async function saveCat() {
      const { error } = await sb.from("categories")
        .update({ name: nameInput.value, color: colorInput.value })
        .eq("id", cat.id);
      if (error) { alert("Errore nel salvataggio della categoria: " + error.message); return; }
      cat.name = nameInput.value; cat.color = colorInput.value;
      if (view === "board") renderBoardView();
    }
    colorInput.addEventListener("change", saveCat);
    nameInput.addEventListener("change", saveCat);
 
    row.querySelector(".category-delete").addEventListener("click", async () => {
      if (!confirm('Eliminare la categoria "' + cat.name + '"? Le schede che la usano resteranno senza categoria.')) return;
      const { error } = await sb.from("categories").delete().eq("id", cat.id);
      if (error) { alert("Errore nell'eliminazione: " + error.message); return; }
      categories = categories.filter((c) => c.id !== cat.id);
      renderCategoriesPanel();
      if (view === "board") renderBoardView();
    });
 
    categoriesList.appendChild(row);
  });
}
 
addCategoryBtn.addEventListener("click", async () => {
  const created = await createCategory("Nuova categoria", "#e5e5e5");
  if (created) { categories.push(created); renderCategoriesPanel(); }
});
